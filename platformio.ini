[platformio]
default_envs = esp32p4

[env]
build_flags =
  -std=gnu++17
  -Wall
  ; -DXSFC_DEBUG_SERIAL
;  -DXSFC_DEBUG_PIN=2 ; specify pin number (board specific)
;  -DXSFC_DEV_PRESET_MODES
;  -DXSFC_DEV_PRESET_BLACKBOX_SERIAL=1 ; specify port number (board specific)
;  -DXSFC_DEV_PRESET_BLACKBOX_FLASH
;  -DXSFC_DEV_PRESET_DSHOT
;  -DXSFC_DEV_PRESET_BRUSHED
;  -DXSFC_DEV_PRESET_SCALER
;  -DNO_GLOBAL_INSTANCES
;  -DDEBUG_ESP_PORT=Serial
;  -DDEBUG_ESP_CORE
;  -DDEBUG_ESP_WIFI
check_tool = cppcheck
; check_tool = clangtidy
check_src_filters =
  +<src/*>
  +<lib/Xsfc/src/*>
  +<lib/EscDriver/src/*>
  +<test/*>
extra_scripts = 
  bin/pio_format.py
build_unflags =
  -std=gnu++11
  -ggdb

monitor_speed = 115200
upload_speed = 921600
; upload_speed = 460800
; monitor_filters = esp32_exception_decoder

lib_deps =
  yoursunny/WifiEspNow @ ^0.0.20230713
  https://github.com/rtlopez/espnow-rclink/archive/refs/tags/v0.1.1.zip
;  EspNowRcLink=symlink://../espnow-rclink

[env:esp32]
board = lolin32
; Official platform with Arduino 2.0.17 / ESP-IDF 4.4.7.
platform = platformio/espressif32@6.12.0
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4M_nota.csv
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py

[env:esp32s3]
board = lolin_s3_mini
; Keep the legacy RMT and software I2C drivers on Arduino 2.x.
platform = platformio/espressif32@6.12.0
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4M_nota.csv
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
  -DBOARD_HAS_PSRAM
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes

; Arduino 3.x / ESP-IDF 5.x is required for ESP32-P4.
; Keep the existing ESP32/S3 toolchain unchanged.
[env:esp32p4]
; FireBeetle 2 ESP32-P4 V1.0: same 360 MHz / 16 MB flash / 32 MB PSRAM
; build profile as EV Board; XSFC header pinout is in TargetESP32p4.h.
board = esp32-p4-evboard
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
board_build.f_cpu = 360000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_16M_nota.csv
lib_deps =
lib_ignore =
  WifiEspNow
  espnow-rclink
build_unflags =
  ${env.build_unflags}
  -std=gnu++2b
  -std=gnu++2a
build_flags =
  ${env.build_flags}
  -DESP32P4
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
